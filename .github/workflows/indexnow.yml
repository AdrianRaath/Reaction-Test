name: IndexNow

on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Give Vercel a moment to finish deploying, so the key file and
      # updated pages are live before the engines come looking.
      - run: sleep 60
      - run: node scripts/submit-indexnow.mjs
